# =============================================================================
# Docker Compose — dashboard service only.
#
# The smart-detector runs natively on the Pi (libcamera cannot run in Docker).
# Start it separately:
#   cd ~/Networks-IOT-Assignment
#   source .venv/bin/activate
#   PYTHONPATH=app python3 app/main.py
#
# The dashboard reads detections from MongoDB Atlas (when MONGO_URI is set)
# or from the shared SQLite file via the ./data volume mount.
#
# DB_PATH does not need to be set manually — config.py derives it from
# PROJECT_ROOT=/Networks-IOT-Assignment which is set in the Dockerfile.
# =============================================================================
services:

  # ── Flask Dashboard ─────────────────────────────────────────────────────────
  # The smart-detector service is intentionally absent.
  # libcamera is a Pi kernel driver that cannot run inside a Docker container.

  dashboard:
    build: .
    container_name: iot-dashboard
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "5000:5000"

    volumes:
      - ./data:/Networks-IOT-Assignment/data     # reads detections.db written by native detector loop
      - ./images:/Networks-IOT-Assignment/images # reads annotated images saved by native detector loop
      - ./logs:/Networks-IOT-Assignment/logs     # shared log directory

    command: [
      "gunicorn",
      "--workers", "1",
      "--threads", "4",
      "--worker-class", "gthread",
      "--bind", "0.0.0.0:5000",
      "dashboard:app"
    ]    