# =============================================================================
# Two services sharing one Docker image:
#
#   smart-detector
#     Main detection loop. Runs continuously on the Pi.
#     Requires Pi hardware (camera + SenseHAT).
#     Pipeline: preview stream → OpenCV motion → HQ capture → YOLO → events
#
#   Flask web dashboard. 
#     Reads from MongoDB Atlas when configured,
#     or from shared SQLite database when running locally.
#     No hardware access needed.
#     Accessible at http://YOUR_PI_IP:5000
#     Can also be deployed to Render (gunicorn app.dashboard:app).
#
# IMPORTANT — DB_PATH in .env:
#   Set DB_PATH=/app/data/detections.db when using Docker.
#   The ./data directory mount is used instead of a direct file mount
#   because Docker creates a directory (not a file) if the path doesn't
#   exist, which breaks SQLite.
#
# Pi Camera / SenseHAT:
#   privileged: true and /dev mount are required for libcamera (CSI camera)
#   and SenseHAT GPIO access inside the container.
#
# MongoDB Atlas:
#   Both services read MONGO_URI from .env automatically via env_file.
#   The smart-detector uses it for the dual-write mirror.
#   The dashboard uses it to serve the Render-accessible API endpoints.
#   No extra Docker networking is needed -- Atlas is an external service.
# =============================================================================
services:

  # ── Detection loop ──────────────────────────────────────────────────────────
  smart-detector:
    build: .
    container_name: smart-iot-detector
    restart: unless-stopped
    env_file:
      - .env

    # Required for Pi Camera (libcamera/CSI) and SenseHAT GPIO.
    privileged: true

    volumes:
      - /dev:/dev              # full device access for camera + SenseHAT
      - ./logs:/app/logs       # persistent log files
      - ./images:/app/images   # persistent detection images
      - ./data:/app/data       # shared SQLite database directory
      - ./models:/app/models   # YOLO ONNX model

    command: ["python", "app/main.py"]


  # ── Flask dashboard ─────────────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: iot-dashboard
    restart: unless-stopped
    env_file:
      - .env

    ports:
      - "5000:5000"

    volumes:
      - ./data:/app/data       # reads from same DB as smart-detector
      - ./images:/app/images   # serves detection images

    command: [
      "gunicorn",
      "--workers", "1",
      "--threads", "4",
      "--bind", "0.0.0.0:5000",
      "app.dashboard:app"
    ]

    depends_on:
      - smart-detector